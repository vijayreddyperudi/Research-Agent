version: '3.8'

services:
  api:
    build: .
    container_name: research_agent_api
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/workspace
    restart: unless-stopped

  ui:
    build: .
    container_name: research_agent_ui
    command: streamlit run app/ui.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - .:/workspace
    depends_on:
      - api
    restart: unless-stopped

